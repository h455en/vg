name: Clean Old Workflow Runs v0.3

on:
  workflow_dispatch:
    inputs:
      cutoff_days:
        description: "Delete runs older than this many days (e.g. 30)"
        required: true
        type: number
        default: 30
      status:
        description: "Status to filter (completed, failure, etc.)"
        required: true
        type: string
        default: "completed"
      dry_run:
        description: "Dry run only (no deletion)"
        required: false
        type: boolean
        default: true

permissions:
  actions: write   # Required to delete runs

jobs:
  clean-runs:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STATUS: ${{ inputs.status }}
          CUTOFF_DAYS: ${{ inputs.cutoff_days }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Calculate cutoff date (UTC)
          CUTOFF=$(date -u -d "-${CUTOFF_DAYS} days" +"%Y-%m-%dT%H:%M:%SZ")
          echo "🗑️  Will delete runs with status '$STATUS' created before: $CUTOFF"
          echo "Dry run: $DRY_RUN"

          # Use gh CLI with built-in filtering (very efficient)
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/runs?status=$STATUS&created=<$CUTOFF" \
            --jq '.workflow_runs[] | {id: .id, created_at: .created_at, name: .name, conclusion: .conclusion}' \
            | while read -r run; do
                id=$(echo "$run" | jq -r '.id')
                created=$(echo "$run" | jq -r '.created_at')
                name=$(echo "$run" | jq -r '.name')
                conclusion=$(echo "$run" | jq -r '.conclusion')

                echo "🗑️  Deleting: $name (ID: $id, created: $created, conclusion: $conclusion)"

                if [[ "$DRY_RUN" == "true" ]]; then
                  echo "   [DRY RUN] - would have deleted"
                else
                  gh api -X DELETE "/repos/$REPO/actions/runs/$id" --silent || echo "   Failed to delete $id"
                fi
              done

          echo "✅ Cleanup finished!"